version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci3_legacy_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: ci3_legacy_db
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: cba_ukp_center
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
